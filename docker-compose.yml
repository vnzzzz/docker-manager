services:
  traefik:
    container_name: traefik
    hostname: traefik
    restart: always
    image: traefik:v3.7.10
    ports:
      - "127.0.0.1:80:80"
      - "[::1]:80:80"
      # TLS を使う場合は 443 も loopback のみに公開する
      # - "127.0.0.1:443:443"
      # - "[::1]:443:443"
      # ダッシュボードは traefik.localhost 経由で出すので 8080 は基本不要
      # - "127.0.0.1:8080:8080"
      # - "[::1]:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      web:
      dns:
        ipv4_address: 172.31.0.11
    labels:
      - "traefik.enable=true"
      # Traefik dashboard を http://traefik.localhost で公開
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"

  portainer:
    container_name: portainer
    hostname: portainer
    restart: always
    image: portainer/portainer-ce:2.39.6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      # Portainer 本体を http://portainer.localhost で公開
      - "traefik.http.routers.portainer.rule=Host(`portainer.localhost`)"
      - "traefik.http.routers.portainer.entrypoints=web"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  coredns:
    image: coredns/coredns:1.14.6
    container_name: coredns
    restart: unless-stopped
    command: -conf /Corefile
    extra_hosts:
      # CoreDNS の既存 rewrite target を Traefik の dns network 側IPへ向ける
      - "host.docker.internal:172.31.0.11"
    volumes:
      - ./config/coredns/Corefile:/Corefile:ro
      - ./local/coredns:/local:ro
    networks:
      dns:
        ipv4_address: 172.31.0.10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: keycloak
    restart: unless-stopped
    command:
      - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:?Set KC_BOOTSTRAP_ADMIN_USERNAME in .env}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}"
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
    mem_limit: 1g
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; }
          0<>/dev/tcp/127.0.0.1/9000
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      web:
      dns:
    volumes:
      - ./data/keycloak:/opt/keycloak/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.localhost`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-docker-manager_web}"

networks:
  web:
    driver: bridge
    name: ${TRAEFIK_NETWORK:-docker-manager_web}
  dns:
    driver: bridge
    name: ${DNS_NETWORK:-docker-manager_dns}
    ipam:
      config:
        - subnet: 172.31.0.0/24
